<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 20px; background-color: #f0f4f8; color: #102a43; }
    .container { max-width: 1200px; margin: auto; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 12px rgba(16,42,67,0.08); border-top: 5px solid #102a43; }
    .brand-header { display: flex; align-items: center; justify-content: space-between; border-bottom: 2px solid #f0f4f8; padding-bottom: 15px; margin-bottom: 20px; }
    .brand-logo-container { display: flex; align-items: center; gap: 12px; }
    .brand-title { margin: 0; font-size: 20px; color: #102a43; font-weight: 700; letter-spacing: -0.5px; }
    button { padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; background: #102a43; color: white; font-weight: 600; transition: background 0.2s; }
    button:hover { background: #243b53; }
    .dashboard-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
    .card { background: #f8fafc; padding: 20px; border-radius: 6px; border: 1px solid #e2e8f0; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; background: white; }
    th, td { border-bottom: 1px solid #e2e8f0; padding: 10px; text-align: left; }
    th { background: #f1f5f9; color: #334e68; position: sticky; top: 0; }
    .scrollable-table { max-height: 500px; overflow-y: auto; border: 1px solid #e2e8f0; border-radius: 4px; }
    .badge { padding: 3px 8px; border-radius: 12px; font-size: 11px; font-weight: bold; }
    .badge-buy { background: #dcfce7; color: #166534; }
    .badge-sell { background: #fee2e2; color: #991b1b; }
  </style>
</head>
<body>

  <div class="container">
    <div class="brand-header">
      <div class="brand-logo-container">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: #2c3e50;">
          <path d="M12 22l-4-4-4-2 1-6-3-6 7 2 3-4 3 4 7-2-3 6 1 6-4 2-4 4z"></path>
          <circle cx="9" cy="12" r="1" fill="currentColor"></circle>
          <circle cx="15" cy="12" r="1" fill="currentColor"></circle>
        </svg>
        <h2 class="brand-title">SikmaWolff - Teacher Admin</h2>
      </div>
      <button onclick="loadTeacherData()">Refresh Data</button>
    </div>

    <div class="dashboard-grid">
      <div class="card">
        <h3 style="margin-top: 0;">Class Overview & Rankings</h3>
        <div class="scrollable-table">
          <table>
            <thead>
              <tr><th>Rank</th><th>Student Name</th><th>Liquid Cash</th><th>Total Net Worth</th></tr>
            </thead>
            <tbody id="adminLeaderboard">
              <tr><td colspan="4">Loading class data...</td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <div class="card">
        <h3 style="margin-top: 0;">Recent Market Transactions</h3>
        <div class="scrollable-table">
          <table>
            <thead>
              <tr><th>Time</th><th>Student</th><th>Action</th><th>Details</th></tr>
            </thead>
            <tbody id="adminLogs">
              <tr><td colspan="4">Loading transaction history...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script>
    function formatMoney(num) {
      return '$' + parseFloat(num).toFixed(2);
    }

    function loadTeacherData() {
      google.script.run.withSuccessHandler(board => {
        const tbody = document.getElementById('adminLeaderboard');
        tbody.innerHTML = '';
        board.forEach(student => {
          tbody.innerHTML += '<tr><td><strong>#' + student.rank + '</strong></td><td>' + student.name + '</td><td>' + formatMoney(student.cash) + '</td><td><strong>' + formatMoney(student.total) + '</strong></td></tr>';
        });
      }).getLeaderboard();

      google.script.run.withSuccessHandler(logs => {
        const tbody = document.getElementById('adminLogs');
        tbody.innerHTML = '';
        
        logs.reverse().forEach(log => {
          const date = log[0];
          const student = log[1];
          const action = log[2];
          let details = log[3];
          
          let badgeClass = '';
          if (action === 'BUY') badgeClass = 'badge-buy';
          else if (action === 'SELL') badgeClass = 'badge-sell';
          
          try {
             const parsed = JSON.parse(details);
             if (parsed.ticker) {
                details = parsed.ticker + ' | Val: ' + formatMoney(parsed.amountInvested || parsed.amountSold);
             }
          } catch(e) { }

          tbody.innerHTML += '<tr><td style="font-size: 11px; color: #64748b;">' + date + '</td><td><strong>' + student + '</strong></td><td><span class="badge ' + badgeClass + '">' + action + '</span></td><td style="font-size: 11px;">' + details + '</td></tr>';
        });
      }).getTransactionLogs();
    }

    window.onload = loadTeacherData;
  </script>
</body>
</html>
